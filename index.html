<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Amr Badr | Data Scientist</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mute:#666;--g1:#f5f5f5;--g2:#ececec;--line:#e2e2e2;--serif:'Young Serif',Georgia,'Times New Roman',serif;--sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.7 var(--sans)}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 6vw;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.nav .logo{font-family:var(--serif);font-size:20px;text-decoration:none;white-space:nowrap}
.nav nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav nav a{font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--mute);white-space:nowrap}
.nav nav a:hover,.nav nav a:focus-visible{color:var(--ink)}
:focus-visible{outline:2px solid #111;outline-offset:3px}
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 56px)}
.hero .l{background:var(--g1);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:48px 6vw 56px}
.hero .tag{font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.hero h1{font-size:clamp(56px,9vw,128px);margin:auto 0;line-height:1}
.hero .row{display:flex;justify-content:space-between;width:100%;gap:16px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.hero .row a{border-bottom:1px solid var(--ink);padding-bottom:3px;text-decoration:none}
.hero .r{background:var(--g2);min-height:320px}
.hero .r img,.ph{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;background:var(--g2);color:#cfcfcf;font:clamp(60px,12vw,160px)/1 var(--serif);min-height:240px}
.sec{padding:96px 6vw;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(180px,1fr) 2.2fr;gap:48px;max-width:1150px;margin:0 auto}
.split>h2{font-size:clamp(30px,4vw,44px)}
.entry{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--line)}
.entry:last-child{border:0;margin:0}
.entry h3{font-size:22px}
.entry .org{font-weight:600;margin:6px 0 0}
.entry .per{color:var(--mute);font-size:13px;margin:0}
.entry p.n{margin:8px 0 0;color:#333}
ul{padding-left:18px;margin:10px 0 0}
li{margin:4px 0}
.about{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.about .a1{padding:96px 6vw;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center}
.about .pic{width:min(280px,70%);aspect-ratio:1;overflow:hidden}
.about .pic .ph{font-size:80px}
.about .a2{background:var(--g2);padding:96px 6vw;display:flex;flex-direction:column;justify-content:center}
.about h2{font-size:clamp(34px,4.4vw,52px);margin-bottom:22px}
.about p{max-width:52ch;margin:0 0 14px}
.about .btns{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.btn{background:#2d2d2d;color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:12px 30px;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:#000}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.sk h3{font-size:20px}
.proj{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;padding:0 0 44px;margin:0 0 44px;border-bottom:1px solid var(--line)}
.proj:last-child{border:0;margin:0;padding:0}
.proj h3{font-size:clamp(28px,3.6vw,40px)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{border:1px solid var(--ink);padding:2px 12px;font-size:12px;border-radius:99px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.more h3{font-size:20px;margin-bottom:6px}
.more p{margin:0}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;max-width:1150px;margin:0 auto}
.contact h2{font-size:clamp(44px,7vw,84px);grid-column:1/-1}
.contact .pic{aspect-ratio:16/10;overflow:hidden;background:var(--g2)}
.contact dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:26px}
.contact dd{margin:4px 0 0;font:19px/1.4 var(--serif);word-break:break-word}
footer{padding:28px 6vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
footer button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;text-decoration:underline}
#adm{display:none;position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:20;background:#fff;border-left:1px solid var(--ink);overflow:auto;padding:18px;font-size:14px}
#adm.open{display:block}
#adm h4{font:22px var(--serif);margin:0 0 10px}
#adm .bar{position:sticky;top:-18px;background:#fff;padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
#adm .bar button,#adm button{font:600 12px var(--sans);padding:7px 12px;border:1px solid var(--ink);background:#fff;cursor:pointer}
#adm .bar .p{background:#111;color:#fff}
#adm .f{margin:10px 0}
#adm label{display:block;font-weight:600;font-size:12px;margin-bottom:3px;text-transform:capitalize}
#adm input:not([type=file]),#adm textarea{width:100%;padding:8px;border:1px solid #bbb;font:14px var(--sans)}
#adm .card{border:1px solid var(--line);padding:10px;margin:8px 0;background:var(--g1)}
#adm .f .f{margin-left:0}
#msg{font-size:13px;color:var(--mute);margin:8px 0}
@media(max-width:820px){.hero,.about,.contact,.proj,.split{grid-template-columns:1fr}.hero{min-height:0}.hero .r{order:-1;height:56vw}.sec,.about .a1,.about .a2{padding:64px 6vw}.split{gap:24px}.nav nav{gap:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="adm"></div>
<script id="data" type="application/json">{
"name":"Amr Badr","role":"Data Scientist","brand":"Portfolio",
"photo":"","photo2":"","photo3":"",
"headline":"I turn sensor and business data into clear decisions.",
"about":["Electronic Engineering student specializing in Cybersecurity and Data Analysis, with hands-on experience in Python, data analysis, machine learning and data-driven engineering projects.","I work with sensor data, embedded systems and real-world engineering applications. I am Vice Head of the IEEE RAS Team and an Embedded Systems Member at Menoufia Racing Team, contributing to Formula Student UK 2026 projects."],
"cvLink":"",
"education":[{"title":"B.Sc. in Electronic Engineering, Cybersecurity & Data Analysis","place":"Faculty of Electronic Engineering, Menoufia University","period":"Expected 2029","note":""}],
"experience":[
{"role":"Vice Head, RAS Team","org":"IEEE Menoufia Student Branch","period":"","points":["Lead and mentor students in robotics, electronics, programming and embedded systems.","Tutor team members and support technical problem-solving and project development.","Coordinate technical tasks and contribute to project planning and implementation."]},
{"role":"Embedded Systems Member","org":"Menoufia Racing Team","period":"Formula Student UK 2026","points":["Developed and integrated embedded systems and sensors for the racing car.","Worked with STM32, data acquisition, sensor integration, testing and debugging.","Contributed to systems for wheel speed, steering angle, temperature, IMU, GPS, fuel level and gear position."]},
{"role":"Data Science Trainee","org":"Digital Egypt Pioneers Initiative (DEPI)","period":"","points":["Applied Python, data analysis and machine learning concepts through practical projects and training."]}],
"skills":[
{"group":"Programming & Data Science","items":["Python","NumPy","Pandas","Data Cleaning","EDA","Statistical Analysis","Data Visualization","Machine Learning"]},
{"group":"Machine Learning","items":["Supervised Learning","Unsupervised Learning","Feature Engineering","Model Evaluation","Predictive Modeling"]},
{"group":"Tools","items":["Jupyter Notebook","Git & GitHub","Matplotlib","Seaborn","Excel"]},
{"group":"Engineering","items":["Arduino","ESP32","STM32","Sensors & Data Acquisition","Embedded Systems","IoT","PCB Design (KiCad)"]}],
"projects":[
{"title":"Queue Waiting Time Optimization","desc":"Analyzed queue data to identify the factors affecting customer waiting time, using data preprocessing, exploratory analysis, feature engineering and machine learning to support queue optimization.","tags":["Python","Pandas","Machine Learning","EDA"],"link":""},
{"title":"Data-Driven Electronics Projects","desc":"Built standalone projects combining sensors, microcontrollers, data acquisition and data analysis. Collected and processed real-world sensor data to analyze system behavior and evaluate performance.","tags":["ESP32","Sensors","Data Acquisition","Analysis"],"link":""}],
"certificates":[
{"title":"Mathematics for Machine Learning and Data Science Specialization","org":"DeepLearning.AI","link":""},
{"title":"Python for Data Science","org":"IBM","link":""},
{"title":"Data Science Training","org":"Digital Egypt Pioneers Initiative (DEPI)","link":""}],
"more":[
{"title":"Teaching & content","text":"Engineering content creator on YouTube, explaining technical subjects through simplified explanations and practical examples."},
{"title":"Languages","text":"Arabic (native), English (professional working proficiency)."},
{"title":"Areas of interest","text":"Data Science, Machine Learning, Data Analysis, AI, Embedded Systems, Robotics, IoT, Computer Vision, Engineering Analytics."}],
"contact":{"email":"amr.bador2006@gmail.com","phone":"+20-106-988-9296","linkedin":"","github":"","youtube":""}
}</script>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
let D=JSON.parse($('data').textContent);
try{const d=localStorage.getItem('amr-draft');if(d)D=JSON.parse(d)}catch(e){}
const N=[['about','About'],['education','Education'],['experience','Experience'],['skills','Skills'],['projects','Projects'],['certificates','Certificates'],['contact','Contact']];
const li=a=>(a||[]).map(x=>`<li>${E(x)}</li>`).join('');
const im=(s,t)=>s?`<img src="${E(s)}" alt="">`:`<div class="ph" aria-hidden="true">${E(t)}</div>`;
const ini=()=>D.name.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2);
const sec=(id,t,b)=>b?`<section class="sec" id="${id}"><div class="split"><h2>${t}</h2><div>${b}</div></div></section>`:'';
function R(){
const c=D.contact||{};
const lk=(h,t)=>h?`<a href="${E(h)}" target="_blank" rel="noopener">${E(t)}</a>`:E(t);
const edu=(D.education||[]).map(x=>`<div class="entry"><h3>${E(x.title)}</h3><p class="org">${E(x.place)}</p><p class="per">${E(x.period)}</p>${x.note?`<p class="n">${E(x.note)}</p>`:''}</div>`).join('');
const exp=(D.experience||[]).map(x=>`<div class="entry"><h3>${E(x.role)}</h3><p class="org">${E(x.org)}</p><p class="per">${E(x.period)}</p><ul>${li(x.points)}</ul></div>`).join('');
const sk=(D.skills||[]).length?`<div class="sk">${D.skills.map(x=>`<div><h3>${E(x.group)}</h3><ul>${li(x.items)}</ul></div>`).join('')}</div>`:'';
const pr=(D.projects||[]).map(x=>`<div class="proj"><h3>${E(x.title)}</h3><div><p style="margin:0">${E(x.desc)}</p><div class="tags">${(x.tags||[]).map(t=>`<span>${E(t)}</span>`).join('')}</div>${x.link?`<p><a href="${E(x.link)}" target="_blank" rel="noopener">View project</a></p>`:''}</div></div>`).join('');
const ce=(D.certificates||[]).map(x=>`<div class="entry"><h3>${x.link?lk(x.link,x.title):E(x.title)}</h3><p class="org">${E(x.org)}</p></div>`).join('');
const mo=(D.more||[]).length?`<div class="more">${D.more.map(x=>`<div><h3>${E(x.title)}</h3><p>${E(x.text)}</p></div>`).join('')}</div>`:'';
const dl=[['Email',c.email&&`<a href="mailto:${E(c.email)}">${E(c.email)}</a>`],['Phone',c.phone&&`<a href="tel:${E(c.phone.replace(/\s/g,''))}">${E(c.phone)}</a>`],['LinkedIn',c.linkedin&&lk(c.linkedin,'Open profile')],['GitHub',c.github&&lk(c.github,'Open profile')],['YouTube',c.youtube&&lk(c.youtube,'Open channel')]].filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('');
$('app').innerHTML=`
<header class="nav"><a class="logo" href="#top">${E(D.name)}</a><nav>${N.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('')}</nav></header>
<section class="hero" id="top"><div class="l"><div class="tag">${E(D.brand)}</div><h1>${D.name.split(' ').map(E).join('<br>')}</h1><div class="row"><span>${E(D.role)}</span><a href="#contact">Contact</a></div></div><div class="r">${im(D.photo,ini())}</div></section>
<section class="about" id="about"><div class="a1"><div class="pic">${im(D.photo2,ini())}</div><h3 style="font-size:24px;text-align:center">${E(D.name)}</h3><span style="color:var(--mute)">${E(D.role)}</span></div><div class="a2"><h2>${E(D.headline)}</h2>${(D.about||[]).map(p=>`<p>${E(p)}</p>`).join('')}<div class="btns"><a class="btn" href="#contact">Email me</a><a class="btn" href="#projects">Projects</a>${D.cvLink?`<a class="btn o" href="${E(D.cvLink)}" target="_blank" rel="noopener">Download CV</a>`:''}</div></div></section>
${sec('education','Education',edu)}${sec('experience','Experience',exp)}${sec('skills','Skills',sk)}
${(D.projects||[]).length?`<section class="sec" id="projects"><div style="max-width:1150px;margin:0 auto"><h2 style="font-size:clamp(36px,5vw,60px);margin-bottom:44px">Projects</h2>${pr}</div></section>`:''}
${sec('certificates','Certificates',ce)}${sec('more','More about me',mo)}
<section class="sec" id="contact"><div class="contact"><h2>Work with me</h2><div class="pic">${im(D.photo3,ini())}</div><dl style="margin:0">${dl}</dl></div></section>
<footer><span>&copy; ${new Date().getFullYear()} ${E(D.name)}</span><button id="ab">Admin</button></footer>`;
$('ab').onclick=openAdm;
}
let tm;const S=()=>{clearTimeout(tm);tm=setTimeout(()=>{R();try{localStorage.setItem('amr-draft',JSON.stringify(D))}catch(e){}},200)};
const msg=t=>{const m=$('msg');if(m)m.textContent=t};
const TPL={education:{title:'',place:'',period:'',note:''},experience:{role:'',org:'',period:'',points:[]},skills:{group:'',items:[]},projects:{title:'',desc:'',tags:[],link:''},certificates:{title:'',org:'',link:''},more:{title:'',text:''}};
const SA=['about','points','items','tags'];
const mk=(t,p)=>Object.assign(document.createElement(t),p||{});
function pic(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=mk('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(f)}
function ed(o,host){for(const k in o){const v=o[k],r=mk('div',{className:'f'});r.append(mk('label',{textContent:k.replace(/([A-Z])/g,' $1')}));
if(/^photo/.test(k)){const i=mk('input',{type:'file',accept:'image/*'});i.onchange=()=>pic(i.files[0],d=>{o[k]=d;S()});r.append(i,mk('button',{textContent:'Remove',onclick:()=>{o[k]='';S()}}))}
else if(SA.includes(k)){const t=mk('textarea',{rows:Math.max(2,v.length+1),value:v.join('\n')});t.oninput=()=>{o[k]=t.value.split('\n').filter(x=>x.trim());S()};r.append(t,mk('small',{textContent:' One item per line'}))}
else if(Array.isArray(v)){v.forEach((it,n)=>{const c=mk('div',{className:'card'});ed(it,c);c.append(mk('button',{textContent:'Move up',onclick:()=>{if(n){v.splice(n-1,0,v.splice(n,1)[0]);bd();S()}}}),mk('button',{textContent:'Delete',onclick:()=>{v.splice(n,1);bd();S()}}));r.append(c)});r.append(mk('button',{textContent:'+ Add '+k,onclick:()=>{v.push(structuredClone(TPL[k]));bd();S()}}))}
else if(typeof v==='object')ed(v,r);
else{const t=mk(v.length>70?'textarea':'input',{value:v});t.oninput=()=>{o[k]=t.value;S()};r.append(t)}
host.append(r)}}
function bd(){const b=$('body');b.innerHTML='';ed(D,b)}
async function pub(){msg('Publishing...');try{const a=window.claude&&await claude.use('artifact');if(!a){msg('Publishing is only available when you open this page from your Claude artifact. Use Export to keep a backup.');return}
try{localStorage.removeItem('amr-draft')}catch(e){}
const c=document.documentElement.cloneNode(true);c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='';const x=c.querySelector('#adm');x.innerHTML='';x.className='';
await a.publish('<!doctype html>'+c.outerHTML)}catch(e){msg('Could not publish: '+(e.message||e.code||e)+'. Only the artifact owner can publish.')}}
function openAdm(){const a=$('adm');a.className='open';a.innerHTML='<h4>Admin login</h4><div class="f"><label>Password</label><input id="pw" type="password" autocomplete="off"></div><button id="go">Log in</button> <button id="x0">Cancel</button><p id="msg"></p>';
$('x0').onclick=()=>a.className='';
const go=()=>{if($('pw').value==='123amr')panel();else msg('Wrong password.')};$('go').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};$('pw').focus()}
function panel(){const a=$('adm');a.innerHTML='<h4>Edit portfolio</h4><div class="bar"><button class="p" id="pb">Save &amp; publish</button><button id="ex">Export</button><label style="margin:0"><input id="im" type="file" accept=".json" hidden><button type="button" id="ib">Import</button></label><button id="rs">Reset</button><button id="cl">Close</button></div><div id="msg">Changes show live. Press Save &amp; publish to make them permanent.</div><div id="body"></div>';
bd();$('pb').onclick=pub;$('cl').onclick=()=>a.className='';
$('ex').onclick=async()=>{const s=JSON.stringify(D,null,1);try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'portfolio-data.json',data:s});return}}catch(e){}
const u=URL.createObjectURL(new Blob([s],{type:'application/json'})),l=mk('a',{href:u,download:'portfolio-data.json'});l.click()};
$('ib').onclick=()=>$('im').click();
$('im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{D=JSON.parse(t);bd();S();msg('Imported.')}catch(x){msg('That file is not valid JSON.')}})};
$('rs').onclick=()=>{try{localStorage.removeItem('amr-draft')}catch(e){}location.reload()}}
R();
</script>
</body>
</html>
