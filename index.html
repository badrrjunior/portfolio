<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Amr Badr | Data Scientist</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style id="mystyle">
:root{--ink:#111;--mute:#666;--g1:#f5f5f5;--g2:#ececec;--line:#e2e2e2;--serif:'Young Serif',Georgia,'Times New Roman',serif;--sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.7 var(--sans)}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 6vw;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.nav .logo{font-family:var(--serif);font-size:20px;text-decoration:none;white-space:nowrap}
.nav nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav nav a{font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--mute);white-space:nowrap}
.nav nav a:hover,.nav nav a:focus-visible{color:var(--ink)}
:focus-visible{outline:2px solid #111;outline-offset:3px}
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 56px)}
.hero .l{background:var(--g1);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:48px 6vw 56px}
.hero .tag{font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.hero h1{font-size:clamp(56px,9vw,128px);margin:auto 0;line-height:1}
.hero .row{display:flex;justify-content:space-between;width:100%;gap:16px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.hero .row a{border-bottom:1px solid var(--ink);padding-bottom:3px;text-decoration:none}
.hero .r{background:var(--g2);min-height:320px}
.hero .r img,.ph{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;background:var(--g2);color:#cfcfcf;font:clamp(60px,12vw,160px)/1 var(--serif);min-height:240px}
.sec{padding:96px 6vw;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(180px,1fr) 2.2fr;gap:48px;max-width:1150px;margin:0 auto}
.split>h2{font-size:clamp(30px,4vw,44px)}
.entry{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--line)}
.entry:last-child{border:0;margin:0}
.entry h3{font-size:22px}
.entry .org{font-weight:600;margin:6px 0 0}
.entry .per{color:var(--mute);font-size:13px;margin:0}
.entry p.n{margin:8px 0 0;color:#333}
ul{padding-left:18px;margin:10px 0 0}
li{margin:4px 0}
.about{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.about .a1{padding:96px 6vw;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center}
.about .pic{width:min(280px,70%);aspect-ratio:1;overflow:hidden}
.about .pic .ph{font-size:80px}
.about .a2{background:var(--g2);padding:96px 6vw;display:flex;flex-direction:column;justify-content:center}
.about h2{font-size:clamp(34px,4.4vw,52px);margin-bottom:22px}
.about p{max-width:52ch;margin:0 0 14px}
.about .btns{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.btn{background:#2d2d2d;color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:12px 30px;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:#000}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
.sk h3{font-size:20px}
.proj{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;padding:0 0 44px;margin:0 0 44px;border-bottom:1px solid var(--line)}
.proj:last-child{border:0;margin:0;padding:0}
.proj h3{font-size:clamp(28px,3.6vw,40px)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{border:1px solid var(--ink);padding:2px 12px;font-size:12px;border-radius:99px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.more h3{font-size:20px;margin-bottom:6px}
.more p{margin:0}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;max-width:1150px;margin:0 auto}
.contact h2{font-size:clamp(44px,7vw,84px);grid-column:1/-1}
.contact .pic{aspect-ratio:16/10;overflow:hidden;background:var(--g2)}
.contact dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:26px}
.contact dd{margin:4px 0 0;font:19px/1.4 var(--serif);word-break:break-word}
footer{padding:28px 6vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
footer button{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;text-decoration:underline}
#adm{display:none;position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:20;background:#fff;border-left:1px solid var(--ink);overflow:auto;padding:18px;font-size:14px}
#adm.open{display:block}
#adm h4{font:22px var(--serif);margin:0 0 10px}
#adm .bar{position:sticky;top:-18px;background:#fff;padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
#adm .bar button,#adm button{font:600 12px var(--sans);padding:7px 12px;border:1px solid var(--ink);background:#fff;cursor:pointer}
#adm .bar .p{background:#111;color:#fff}
#adm .f{margin:10px 0}
#adm label{display:block;font-weight:600;font-size:12px;margin-bottom:3px;text-transform:capitalize}
#adm input:not([type=file]),#adm textarea{width:100%;padding:8px;border:1px solid #bbb;font:14px var(--sans)}
#adm .card{border:1px solid var(--line);padding:10px;margin:8px 0;background:var(--g1)}
#adm .f .f{margin-left:0}
#msg{font-size:13px;color:var(--mute);margin:8px 0}
@media(max-width:820px){.hero,.about,.contact,.proj,.split{grid-template-columns:1fr}.hero{min-height:0}.hero .r{order:-1;height:56vw}.sec,.about .a1,.about .a2{padding:64px 6vw}.split{gap:24px}.nav nav{gap:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
